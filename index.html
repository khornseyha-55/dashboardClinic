<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="/src/style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
</head>
<body>
    <div class="container-fluid">
        <div class="row cover m-auto">
            <div class="col-12 col-md-6 p-0 cover-img-hiden">
                <div class="cover-img d-flex justify-content-center align-items-center flex-column">
                    <h1 class="fw-bold text-white text-decoration-underline">ប្រព័ន្ធគ្រាប់គ្រងមន្ទីពេទ្យ</h1>
                </div>
            </div>
            <div class="col-12 p-0 col-md-6 bg-dark text-white d-flex justify-content-center align-items-center flex-column">
                <div class="sing-in w-75 p-5 shadow rounded-3">
                    <h1 class="fw-bold text-primary text-center">Welcome back</h1>
                    <p class="text-center">Enter Your Condition to accsee the Dashboard</p>
                    <form id="loginForm">
                        <div class="mb-3">
                            <label class="form-label">Username</label>
                            <input type="text" id="username" class="form-control" placeholder="Enter Your Name" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Password</label>
                            <input type="password" id="password" class="form-control" placeholder="Enter Your Password" required>
                        </div>
                        <div class="text-center">
                        <button class="btn btn-primary w-100" type="submit">Sign in</button>
                        <div id="message" class="mt-3 text-center"></div>
                    </div> <hr>
                    </form>
                    <div class="row mt-2">
                        <div class="col-6 mb-2">       
                            <p><input type="checkbox"> Remember me</p>
                        </div>
                        <div class="col-6 mb-2 ">       
                            <a href="#" class="float-end">Forgot Your Password!</a>
                        </div>
                    </div>
                    
                    <h5 class="text-center fw-bold mt-4">NEED ACCSESS</h5> <hr>
                    <p class="text-center">Contect Your administrator for invite to join the staff portal.</p>
                    <div class="text-center">
                        <a href="#" class="text-decoration-none">You don't have account !</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script>
        document.getElementById("loginForm").addEventListener("submit", function(event) {
        event.preventDefault();

            const username = document.getElementById("username").value;
            const userpassword = document.getElementById("password").value;

            const message = document.getElementById("message");
            const Name = "SEYHA";
            const password = "123";
            if (username === Name && userpassword  === password) {
                message.innerHTML = "<div class='alert alert-success'>Login Successful!</div>";
                setTimeout(() => {
                    window.location.href = "./src/index.html";
                }, 1500);

            } else {
                message.innerHTML = "<div class='alert alert-danger'>Invalid username or password.</div>";
            }
        });
    </script>
</body>
</html>
