        <div id="content">
            <nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom p-3">
                <div class="container-fluid">
                    <button type="button" id="sidebarCollapse" class="btn ">
                        <i class="fa-solid fa-bars"></i>
                    </button>
                    <div class="ms-4">
                        <input type="search" class="form-control" placeholder="🔍 Search...">
                    </div>
                    <div class="ms-auto">
                        <img src="https://png.pngtree.com/png-vector/20230418/ourmid/pngtree-medical-logo-vector-png-image_6713322.png" class="float-rigth" width="50px" alt="">

            <div class="container-fluid">
                <h4 class="fw-bold mt-2">Patient Registration <i class="fa-solid fa-user-nurse ms-2"></i></h4>
                <p>Register a new Patient into the client management system.</p>

                    <form action="">
                        <div class="row mb-2">
                            <div class="col">
                                <label class="form-label mb-3">Patient ID *</label>
                                <input type="number" class="form-control" placeholder="Enter Your ID">
                            </div>
                            <div class="col">
                                <label class="form-label mb-3">Registration date *</label>
                                <input type="date" class="form-control" placeholder="Enter Quantity" >
                            </div>
                        </div>
                        <div class="row mb-2">
                            <div class="col-12 col-md-6">
                                <label class="form-label mb-3">Full Name *</label>
                                <input type="text" class="form-control" placeholder="Enter Full Name" >
                            </div>
                            <div class="col-6 col-md-3">
                                <label class="form-label mb-3">Gander *</label>
                                <select class="form-select">
                                    <option selected>Select Gender</option>
                                    <option value="Male">Male</option>
                                    <option value="Female">Female</option>
                                </select>   
                            </div>
                            <div class="col-6 col-md-3">
                                <label class="form-label mb-3">Date of Birth *</label>
                                <input type="date" class="form-control" >
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-12 col-md-4">
                                <label class="form-label mb-3">Phone Number *</label>
                                <input type="number" class="form-control" >
                            </div>
                            <div class="col-12 col-md-4">
                                <label class="form-label mb-3">Email *</label>
                                <input type="email" class="form-control" placeholder="Enter Quantity">
                            </div>
                            <div class="col-12 col-md-4">
                                <label class="form-label mb-3">Blood Group *</label>
                                <select class="form-select">
                                    <option selected>Select Blood Group</option>
                                    <option value="A">Group A</option>
                                    <option value="B">Group B</option>
                                    <option value="C">Group AB</option>
                                    <option value="O">Group O</option>
                                </select>   
                            </div>
                            <div class="mb-3 mt-2">
                                <label class="form-label">Address *</label>
                                <textarea class="form-control" id="address" rows="3"></textarea>
                            </div>
                        </div>
                    </form>
                    <div>
                        <div class="row">
                            <div class="col-6">
                                <label class="form-label mb-3">Emergency contect Name *</label>
                                <select class="form-select">
                                    <option value="royalphnompenhhospital">Royal PhnomPenh hospital</option>
                                    <option value="Chorai Hospital">Chorai Hospital</option>
                                    <option value="Ang Duong Hospital">Ang Duong Hospital</option>
                                </select>
                            </div>
                            <div class="col-6">
                                <label class="form-label mb-3">Emergency contect Number *</label>
                                <select class="form-select">
                                    <option value="royalphnompenhhospital">(885)12 991 000</option>
                                    <option value="royalphnompenhhospital">(885)23 684 1001</option>
                                    <option value="royalphnompenhhospital">(885)23 218 875</option>
                                </select>
                            </div> 
                            <div class="mt-5 text-center p-2">
                                <button class="btn btn-outline-danger fw-bold w-25 me-4">Back</button>
                                <button class="btn btn-outline-primary fw-bold w-25">Registration</button>
                            </div> 
                        </div>
                    </div>
            </div>

        </div>
    </div>

    <script src="./script.js"></script>
</body>
</html>
